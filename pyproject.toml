[project]
name = "content-engine"
version = "0.1.0"
description = "Local content engine: plans, scripts, voices, edits and drafts social video posts for niche identities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.177,<0.3",
    "faster-whisper>=1.2",
    "httpx>=0.27",
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "nvidia-cublas-cu12>=12.8,<=12.9.1.4",
    "onnxruntime>=1.20",
    "opentimelineio>=0.18,<0.19",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidocr-onnxruntime==1.4.4",
    "sqlite-vec==0.1.9",
    "tokenizers>=0.20",
    "typer>=0.12",
    "windows-toasts==1.3.1",
]

[project.scripts]
ce = "engine.cli:app"

[dependency-groups]
dev = [
    "otio-fcpx-xml-adapter>=1.0,<2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "engine"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not golden and not gpu and not live and not model' --strict-markers"
markers = [
    "golden: golden render tests (ffmpeg + ffprobe); run with -m golden",
    "gpu: needs the RTX 5070; run with -m gpu",
    "model: needs the cached embedding model (ce models fetch); run with -m model",
    "live: real vendor calls that cost money or touch real accounts; run with -m live",
    "media: needs ffmpeg and ffprobe on PATH; runs by default, CI leaves it out (ADR 0024)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
