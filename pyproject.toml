[project]
name = "content-engine"
version = "0.1.0"
description = "Local content engine: plans, scripts, voices, edits and drafts social video posts for niche identities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.177,<0.3",
    "faster-whisper>=1.2",
    "httpx>=0.27",
    "nvidia-cublas-cu12>=12.8,<=12.9.1.4",
    "opentimelineio>=0.18,<0.19",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
ce = "engine.cli:app"

[dependency-groups]
dev = [
    "otio-fcpx-xml-adapter>=1.0,<2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "engine"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not golden and not gpu and not live' --strict-markers"
markers = [
    "golden: golden render tests (ffmpeg + ffprobe); run with -m golden",
    "gpu: needs the RTX 5070; run with -m gpu",
    "live: real vendor calls that cost money or touch real accounts; run with -m live",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
